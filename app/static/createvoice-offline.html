<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a voice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2318222D'/><g fill='%23E8A317'><rect x='6' y='14' width='3' height='8'/><rect x='11' y='9' width='3' height='13'/><rect x='16' y='12' width='3' height='10'/><rect x='21' y='7' width='3' height='15'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
  <style>
    .offline { max-width: 640px; margin: 48px auto 0; padding: 26px 28px; background: var(--panel);
               border: 1px solid var(--line); border-radius: var(--radius-l); }
    .offline h2 { margin: 0 0 8px; font-size: 19px; font-weight: 600; }
    .offline p { margin: 0 0 18px; color: var(--mute); max-width: 60ch; }
    .offline .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .offline a.quiet { color: inherit; text-decoration: none; }
    .offline .wait { font-size: 13px; color: var(--mute); margin: 16px 0 0; }
    .brand a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  </style>
</head>
<body>
  <header class="top">
    <h1 class="brand"><a href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g><rect x="4" y="15" width="4" height="9"/><rect x="10" y="9" width="4" height="15"/><rect x="16" y="12" width="4" height="12"/><rect x="22" y="6" width="4" height="18"/></g></svg>
      Audiobook Forge</a>
    </h1>
  </header>
  <main>
    <section class="offline" aria-labelledby="o-title">
      <h2 id="o-title">{{title}}</h2>
      <p>{{text}}</p>
      <div class="row">
        <button type="button" class="primary" id="again">Try again</button>
        <a class="quiet" href="/">Back to your books</a>
      </div>
      <p class="wait" id="wait" aria-live="polite">This page opens the voice creator by itself as soon as it answers.</p>
    </section>
  </main>
  <script>
    "use strict";
    document.getElementById("again").addEventListener("click", () => location.reload());
    // Check quietly every 15 seconds; open the voice creator once it's back.
    setInterval(async () => {
      try {
        const res = await fetch("/createvoice/api/health", { cache: "no-store" });
        if (res.ok) location.reload();
      } catch {}
    }, 15000);
  </script>
</body>
</html>
