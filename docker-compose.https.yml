# HTTPS: a Let's Encrypt certificate, issued and renewed by itself through your
# DNS provider, with nginx serving the app on it. Set it up with:
#   ./https-setup.sh
# which asks for the DNS name and an API key, and starts these two services.
services:
  certbot:
    image: certbot/dns-${DNS_PROVIDER:-cloudflare}:v5.8.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/certbot.sh"]
    environment:
      DOMAIN: ${DOMAIN:?Run ./https-setup.sh first}
      DNS_PROVIDER: ${DNS_PROVIDER:-cloudflare}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-false}
    volumes:
      - ${CERT_DIR:-./certs}:/etc/letsencrypt
      - ./docker/https/certbot.sh:/certbot.sh:ro

  proxy:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on: [web, certbot]
    ports:
      - "${HTTPS_PORT:-443}:443"
      # Plain http on port 80 redirects to https. https-setup.sh moves it out of
      # the way (localhost, any free port) when port 80 is already taken.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    environment:
      DOMAIN: ${DOMAIN}
      HTTPS_SUFFIX: ${HTTPS_SUFFIX:-}  # ":8443" when not on 443, for the http -> https redirect
    volumes:
      - ${CERT_DIR:-./certs}:/etc/letsencrypt:ro
      - ./docker/https/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/https/proxy.sh:/docker-entrypoint.d/99-wait-for-certificate.sh:ro
